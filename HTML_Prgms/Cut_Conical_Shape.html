<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 15px;
        }

        #result {
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            background: lightblue;

            /* Conical shape */
            clip-path: polygon(
                30% 0%,
                70% 0%,
                100% 100%,
                0% 100%
            );
        }

        .line {
            padding: 8px;
        }
    </style>
</head>

<body>

    <h2>Multiplication Table</h2>

    <input type="number" id="num" placeholder="Enter number">

    <button onclick="generateTable()">Generate</button>

    <div id="result"></div>

    <script>

        function generateTable() {

            let num = Number(document.getElementById("num").value);
            let output = "";

            for (let i = 1; i <= 10; i++) {

                output += "<div class='line'>" +
                          num + " × " + i + " = " + (num * i) +
                          "</div>";
            }

            document.getElementById("result").innerHTML = output;
        }

    </script>

</body>
</html>
