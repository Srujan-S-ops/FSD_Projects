<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="student_style.css">
</head>

<body>

    <div class="container">

        <h2>Student Management System</h2>

        <!-- Student Form -->
        <div class="form">

            <input type="text" id="studentId" placeholder="Student ID">
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="course" placeholder="Course">
            <input type="number" id="marks" placeholder="Marks">

            <button onclick="addStudent()">Add Student</button>

        </div>


        <!-- Statistics -->
        <div class="stats">

            <div>
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>

            <div>
                <h3 id="averageMarks">0</h3>
                <p>Average Marks</p>
            </div>

            <div>
                <h3 id="topStudent">-</h3>
                <p>Top Student</p>
            </div>

        </div>


        <!-- Search and Filter -->
        <div class="search">

            <label>Search:</label>

            <input
                type="text"
                id="searchBox"
                placeholder="Search by name or course"
                onkeyup="displayStudents()"
            >

            <button onclick="setFilter('All')">All</button>
            <button onclick="setFilter('Pass')">Passed</button>
            <button onclick="setFilter('Fail')">Failed</button>

        </div>


        <!-- Student Table -->
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>


    <script>

        // Get saved students
        let students = JSON.parse(localStorage.getItem("students")) || [];

        let filter = "All";


        // Add Student
        function addStudent() {

            let id = document.getElementById("studentId").value.trim();
            let name = document.getElementById("studentName").value.trim();
            let email = document.getElementById("email").value.trim();
            let course = document.getElementById("course").value.trim();
            let marks = document.getElementById("marks").value;


            if (id == "" || name == "" || email == "" ||
                course == "" || marks == "") {

                alert("Please fill all the fields");
                return;
            }


            marks = Number(marks);


            if (marks < 0 || marks > 100) {

                alert("Marks should be between 0 and 100");
                return;
            }


            // Check duplicate ID
            for (let student of students) {

                if (student.id == id) {

                    alert("Student ID already exists");
                    return;
                }
            }


            // Add student
            students.push({
                id: id,
                name: name,
                email: email,
                course: course,
                marks: marks
            });


            saveData();

            clearForm();

            displayStudents();
        }


        // Display Students
        function displayStudents() {

            let table = document.getElementById("studentTable");

            let search =
                document.getElementById("searchBox").value.toLowerCase();

            table.innerHTML = "";


            for (let i = 0; i < students.length; i++) {

                let student = students[i];

                let status;

                if (student.marks >= 50) {
                    status = "Pass";
                } else {
                    status = "Fail";
                }


                // Search
                if (
                    !student.name.toLowerCase().includes(search) &&
                    !student.course.toLowerCase().includes(search)
                ) {
                    continue;
                }


                // Filter
                if (filter != "All" && status != filter) {
                    continue;
                }


                table.innerHTML += `
                    <tr>

                        <td>${student.id}</td>

                        <td>${student.name}</td>

                        <td>${student.email}</td>

                        <td>${student.course}</td>

                        <td>${student.marks}</td>

                        <td>${status}</td>

                        <td>
                            <button onclick="deleteStudent(${i})">
                                Delete
                            </button>
                        </td>

                    </tr>
                `;
            }


            updateStats();
        }


        // Delete Student
        function deleteStudent(index) {

            if (confirm("Are you sure you want to delete this student?")) {

                students.splice(index, 1);

                saveData();

                displayStudents();
            }
        }


        // Filter
        function setFilter(value) {

            filter = value;

            displayStudents();
        }


        // Save data
        function saveData() {

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }


        // Clear Form
        function clearForm() {

            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("email").value = "";
            document.getElementById("course").value = "";
            document.getElementById("marks").value = "";
        }


        // Update Statistics
        function updateStats() {

            let total = students.length;

            document.getElementById("totalStudents").innerText = total;


            if (total == 0) {

                document.getElementById("averageMarks").innerText = "0";
                document.getElementById("topStudent").innerText = "-";

                return;
            }


            let totalMarks = 0;
            let top = students[0];


            for (let student of students) {

                totalMarks += Number(student.marks);


                if (Number(student.marks) > Number(top.marks)) {
                    top = student;
                }
            }


            let average = totalMarks / total;


            document.getElementById("averageMarks").innerText =
                average.toFixed(1);

            document.getElementById("topStudent").innerText =
                top.name;
        }


        // Load students when page opens
        displayStudents();

    </script>

</body>
</html>
